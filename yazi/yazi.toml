[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 8

[preview]
wrap = "yes"
tab_size = 2
max_width = 1000
max_height = 1000

[opener]
edit = [
    { run = '${EDITOR:-vim} "$@"', block = true, for = "unix" }
]

open = [
    { run = 'xdg-open "$1"', orphan = true, for = "linux" }
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/pdf", use = "open" },
    { mime = "image/*", use = "open" },
    { mime = "video/*", use = "open" },
    { mime = "audio/*", use = "open" },
]

[input]
cursor_blink = true

[which]
sort_by = "none"
sort_sensitive = false
sort_translit = true

[tasks]
micro_workers = 5
macro_workers = 10
bizarre_retry = 3

