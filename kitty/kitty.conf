# Kitty terminal configuration
# Generated Tue Sep 13 2026

# ---- General ----
font_family            JetBrainsMono Nerd Font
font_size              11.0
adjust_line_height     0
adjust_column_width    0
disable_ligatures      never
background_opacity     0.95
dynamic_background_opacity  no
background_blur        20
cursor_blink_interval  0.5
cursor_stop_blinking_after  15
scrollback_lines       10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier  1.0
mouse_hide_wait        3.0
tab_bar_min_tabs       2
tab_bar_style          powerline
remember_window_size   yes
initial_window_width   1000
initial_window_height  640
window_padding_width   0
window_margin_width    0
window_border_width    1
placement_strategy     center
copy_on_select         clipboard
strip_trailing_spaces  smart
clipboard_control      write-clipboard write-primary read-clipboard read-primary

# ---- Terminal bell ----
bell_on_tab            notify
visual_bell_duration   0.2
enable_audio_bell      no

# ---- Mouse ----
# Clickable URLs & middle-click paste are enabled by default

# ================== Keymap ==================
# Modifier                                     ctrl+shift
# Directional splits (vim keys)                ctrl+shift+alt+h/j/k/l
# ------------------------------------------------------------------
# ctrl+shift+c        copy selection to clipboard
# ctrl+shift+v        paste from clipboard
# ctrl+shift+s        paste from selection (primary)
# ctrl+plus / minus/0 increase / decrease / reset font size
# ctrl+shift+up/down  scroll one line
# ctrl+shift+pgup/dn  scroll one page
# ctrl+shift+h        open scrollback browser
# ctrl+shift+enter    new window (split current layout)
# ctrl+shift+t/n      new tab in current working directory
# ctrl+shift+q        close tab
# ctrl+shift+right    next tab
# ctrl+shift+left     previous tab
# ctrl+shift+]        next window (pane)
# ctrl+shift+[        previous window (pane)
# ctrl+shift+space    next layout
# ctrl+shift+e        close window (pane)
# ctrl+shift+f5       reload config
# ctrl+shift+p        select terminal contents
# ctrl+shift+alt+h    split left   (new pane, same cwd)
# ctrl+shift+alt+j    split bottom (new pane, same cwd)
# ctrl+shift+alt+k    split top    (new pane, same cwd)
# ctrl+shift+alt+l    split right  (new pane, same cwd)
# =============================================================

# Copy / paste
map ctrl+shift+c      copy_to_clipboard
map ctrl+shift+v      paste_from_clipboard
map ctrl+shift+s      paste_from_selection

# Font size
map ctrl+plus         increase_font_size
map ctrl+minus        decrease_font_size
map ctrl+0            restore_font_size

# Scrolling
map ctrl+shift+up     scroll_line_up
map ctrl+shift+down   scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+h      show_scrollback

# Tabs
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+q      close_tab
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+n      new_tab_with_cwd

# Windows / panes
map ctrl+shift+enter  new_window_with_cwd
map ctrl+shift+]      next_window
map ctrl+shift+[      previous_window
map ctrl+shift+space  next_layout
map ctrl+shift+l      next_layout
map ctrl+shift+e      close_window

# Directional splits - new pane opened in the current working directory
map ctrl+shift+alt+h  launch --location=vsplit --before --cwd=current
map ctrl+shift+alt+j  launch --location=hsplit --cwd=current
map ctrl+shift+alt+k  launch --location=hsplit --before --cwd=current
map ctrl+shift+alt+l  launch --location=vsplit --cwd=current

# Reload config
map ctrl+shift+f5     load_config_file

# Readline / selection
map ctrl+shift+p      select_terminal_contents

